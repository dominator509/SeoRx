openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SEORx API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user profile
  - name: organizations
    description: Organization management
  - name: clients
    description: Client management
  - name: audits
    description: SEO audit jobs
  - name: issues
    description: SEO audit issues
  - name: reports
    description: Report generation
  - name: dashboard
    description: Dashboard metrics and summaries
  - name: ai-providers
    description: AI provider configuration
  - name: pagespeed
    description: PageSpeed Insights integration
  - name: integrations
    description: External integrations and outbound webhooks
  - name: api-keys
    description: Developer API key management
  - name: billing
    description: Billing plans, checkout, portal, and Stripe webhooks
  - name: approvals
    description: Human approval workflow
  - name: geo-aeo
    description: Generative engine and answer engine optimization workflows

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateMe
      tags: [auth]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileBody"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List all organizations for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create a new organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationBody"
      responses:
        "201":
          description: Created organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /organizations/{id}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get organization by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationBody"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteOrganization
      tags: [organizations]
      summary: Delete organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{orgId}/members:
    get:
      operationId: listOrgMembers
      tags: [organizations]
      summary: List members of an organization
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: inviteOrgMember
      tags: [organizations]
      summary: Invite a member to an organization
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteOrgMemberBody"
      responses:
        "201":
          description: Invited member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgMember"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients accessible to current user
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: query
          schema:
            type: string
          description: Filter by organization ID
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or domain
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientBody"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get client by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateClient
      tags: [clients]
      summary: Update client
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientBody"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete client
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /audits:
    get:
      operationId: listAudits
      tags: [audits]
      summary: List audit jobs
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of audit jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAudit
      tags: [audits]
      summary: Create a new audit job
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuditBody"
      responses:
        "201":
          description: Created audit job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audit"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /audits/{id}:
    get:
      operationId: getAudit
      tags: [audits]
      summary: Get audit job by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Audit job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAudit
      tags: [audits]
      summary: Delete audit job
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /audits/{id}/issues:
    get:
      operationId: listAuditIssues
      tags: [issues]
      summary: List issues for an audit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low, info]
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [open, approved, dismissed, fixed]
      responses:
        "200":
          description: List of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditIssue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /issues/{id}/approve:
    put:
      operationId: approveIssue
      tags: [approvals]
      summary: Approve an issue fix recommendation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveIssueBody"
      responses:
        "200":
          description: Approved issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditIssue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /issues/{id}/dismiss:
    put:
      operationId: dismissIssue
      tags: [approvals]
      summary: Dismiss an issue
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissIssueBody"
      responses:
        "200":
          description: Dismissed issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditIssue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /audits/{id}/geo/overview:
    get:
      operationId: getGeoAeoOverview
      tags: [geo-aeo]
      summary: Get GEO/AEO profile, prompts, observations, recommendations, and score
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: GEO/AEO overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoAeoOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /audits/{id}/geo/profile:
    put:
      operationId: saveGeoAeoProfile
      tags: [geo-aeo]
      summary: Save a GEO/AEO audit profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoAeoProfileInput"
      responses:
        "201":
          description: Saved GEO/AEO profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoAeoProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /audits/{id}/geo/prompts/generate:
    post:
      operationId: generateGeoAeoPrompts
      tags: [geo-aeo]
      summary: Generate GEO/AEO prompt set for an audit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateGeoAeoPromptsBody"
      responses:
        "201":
          description: Generated prompts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoAeoPromptList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /audits/{id}/geo/prompts:
    get:
      operationId: listGeoAeoPrompts
      tags: [geo-aeo]
      summary: List GEO/AEO prompts for an audit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: GEO/AEO prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeoAeoPrompt"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /audits/{id}/geo/observations:
    post:
      operationId: createGeoAeoObservation
      tags: [geo-aeo]
      summary: Create a manual GEO/AEO visibility observation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoAeoObservationInput"
      responses:
        "201":
          description: Created observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoAeoObservation"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /audits/{id}/geo/recommendations:
    post:
      operationId: createGeoAeoRecommendation
      tags: [geo-aeo]
      summary: Create a GEO/AEO recommendation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoAeoRecommendationInput"
      responses:
        "201":
          description: Created recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoAeoRecommendation"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /audits/{id}/geo/recommendations/{recommendationId}:
    patch:
      operationId: updateGeoAeoRecommendation
      tags: [geo-aeo]
      summary: Edit or hide a GEO/AEO recommendation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: recommendationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoAeoRecommendationUpdate"
      responses:
        "200":
          description: Updated recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoAeoRecommendation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /audits/{id}/geo/recommendations/{recommendationId}/approve:
    post:
      operationId: approveGeoAeoRecommendation
      tags: [geo-aeo]
      summary: Approve a GEO/AEO recommendation into an audit issue
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: recommendationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Approved recommendation and created audit issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoAeoApprovedRecommendation"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /audits/{id}/geo/score:
    post:
      operationId: createGeoAeoScoreSnapshot
      tags: [geo-aeo]
      summary: Calculate and persist a GEO/AEO score snapshot
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "201":
          description: GEO/AEO score snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoAeoScoreSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List generated reports
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: query
          schema:
            type: string
        - name: auditId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createReport
      tags: [reports]
      summary: Generate a report for an audit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportBody"
      responses:
        "201":
          description: Created report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get report by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteReport
      tags: [reports]
      summary: Delete report
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /reports/{id}/download:
    get:
      operationId: downloadReport
      tags: [reports]
      summary: Download a ready report PDF
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: PDF report stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/recent-audits:
    get:
      operationId: getRecentAudits
      tags: [dashboard]
      summary: Get recent audit activity
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent audits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Audit"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/issue-breakdown:
    get:
      operationId: getIssueBreakdown
      tags: [dashboard]
      summary: Get issue severity breakdown across all audits
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Issue breakdown by severity and category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueBreakdown"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard/score-trends:
    get:
      operationId: getScoreTrends
      tags: [dashboard]
      summary: Get SEO score trends over time
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: query
          schema:
            type: string
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Score trend data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScoreTrend"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ai-providers:
    get:
      operationId: listAiProviders
      tags: [ai-providers]
      summary: List AI provider configurations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of AI providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAiProvider
      tags: [ai-providers]
      summary: Add an AI provider configuration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAiProviderBody"
      responses:
        "201":
          description: Created AI provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ai-providers/{id}:
    put:
      operationId: updateAiProvider
      tags: [ai-providers]
      summary: Update AI provider configuration
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAiProviderBody"
      responses:
        "200":
          description: Updated AI provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
        "401":
