components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    UserProfile:
      type: object
      properties:
        id:
          type: string
        clerkId:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        role:
          type: string
          enum: [superadmin, admin, agency, client, viewer]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - clerkId
        - email
        - role
        - createdAt
        - updatedAt

    UpdateUserProfileBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: string

    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type: string
          nullable: true
        plan:
          type: string
          enum: [free, starter, professional, enterprise]
        memberCount:
          type: integer
        clientCount:
          type: integer
        auditCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - plan
        - memberCount
        - clientCount
        - auditCount
        - createdAt
        - updatedAt

    CreateOrganizationBody:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type: string
      required:
        - name
        - slug

    UpdateOrganizationBody:
      type: object
      properties:
        name:
          type: string
        logoUrl:
          type: string
        plan:
          type: string
          enum: [free, starter, professional, enterprise]

    OrgMember:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        email:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, agency, client, viewer]
        joinedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - email
        - role
        - joinedAt

    InviteOrgMemberBody:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, agency, client, viewer]
      required:
        - email
        - role

    Client:
      type: object
      properties:
        id:
          type: string
        orgId:
          type: string
        name:
          type: string
        domain:
          type: string
        industry:
          type: string
          nullable: true
        contactEmail:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        seoScore:
          type: number
          nullable: true
        lastAuditAt:
          type: string
          format: date-time
          nullable: true
        auditCount:
          type: integer
        issueCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - orgId
        - name
        - domain
        - auditCount
        - issueCount
        - createdAt
        - updatedAt

    CreateClientBody:
      type: object
      properties:
        orgId:
          type: string
        name:
          type: string
        domain:
          type: string
        industry:
          type: string
        contactEmail:
          type: string
          format: email
        logoUrl:
          type: string
      required:
        - orgId
        - name
        - domain

    UpdateClientBody:
      type: object
      properties:
        name:
          type: string
        domain:
          type: string
        industry:
          type: string
        contactEmail:
          type: string
        logoUrl:
          type: string

    Audit:
      type: object
      properties:
        id:
          type: string
        clientId:
          type: string
        clientName:
          type: string
        url:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        auditType:
          type: string
          enum: [seo, geo_aeo, hybrid]
        seoScore:
          type: number
          nullable: true
        aiVisibilityScore:
          type: number
          nullable: true
        issueCount:
          type: integer
        criticalCount:
          type: integer
        highCount:
          type: integer
        mediumCount:
          type: integer
        lowCount:
          type: integer
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - clientId
        - clientName
        - url
        - status
        - auditType
        - issueCount
        - criticalCount
        - highCount
        - mediumCount
        - lowCount
        - createdAt
        - updatedAt

    AuditDetail:
      allOf:
        - $ref: "#/components/schemas/Audit"
        - type: object
          properties:
            crawledPages:
              type: integer
            scanDurationMs:
              type: integer
              nullable: true
            aiProviderUsed:
              type: string
              nullable: true
            pageSpeedScore:
              type: number
              nullable: true
            issues:
              type: array
              items:
                $ref: "#/components/schemas/AuditIssue"

    AuditList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Audit"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - items
        - total
        - limit
        - offset

    CreateAuditBody:
      type: object
      properties:
        clientId:
          type: string
        url:
          type: string
          format: uri
        maxPages:
          type: integer
          default: 100
        includePageSpeed:
          type: boolean
          default: false
        aiProviderId:
          type: string
          nullable: true
        auditType:
          type: string
          enum: [seo, geo_aeo, hybrid]
          default: seo
      required:
        - clientId
        - url

    AuditIssue:
      type: object
      properties:
        id:
          type: string
        auditId:
          type: string
        url:
          type: string
        category:
          type: string
          enum: [meta, content, performance, links, structured_data, mobile, security, crawlability, ai_answer_coverage, entity_clarity, ai_citable_structure, proof_trust, competitor_gap, service_location_gap, citation_readiness]
        issueType:
          type: string
          nullable: true
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        title:
          type: string
        description:
          type: string
        evidence:
          type: object
          additionalProperties: true
          nullable: true
        recommendation:
          type: string
          nullable: true
        aiRecommendation:
          type: string
          nullable: true
        aiVisibilityImpact:
          type: string
          nullable: true
        businessImpact:
          type: string
          nullable: true
        estimatedEffort:
          type: string
          nullable: true
        recommendedOwner:
          type: string
          nullable: true
        priorityScore:
          type: number
        status:
          type: string
          enum: [open, approved, dismissed, fixed]
        approvedBy:
          type: string
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        affectedElement:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - auditId
        - url
        - category
        - severity
        - title
        - description
        - priorityScore
        - status
        - createdAt

    ApproveIssueBody:
      type: object
      properties:
        notes:
          type: string

    DismissIssueBody:
      type: object
      properties:
        reason:
          type: string

    GeoAeoPackageTier:
      type: string
      enum: [basic, standard, premium, custom]

    GeoAeoSurface:
      type: string
      enum: [chatgpt, gemini, perplexity, google_ai_overviews, google_ai_mode, copilot, claude, manual_observation, simulated_retrieval]

    GeoAeoPromptIntent:
      type: string
      enum: [discovery, local_service, comparison, best_provider, pricing, problem_solution, faq, alternative, trust_validation]

    GeoAeoCompetitor:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
      required:
        - url

    GeoAeoProfileInput:
      type: object
      properties:
        businessName:
          type: string
        websiteUrl:
          type: string
          format: uri
        primaryOffer:
          type: string
        targetLocations:
          type: array
          items:
            type: string
        targetServices:
          type: array
          items:
            type: string
        targetCustomers:
          type: array
          items:
            type: string
        competitors:
          type: array
          items:
            $ref: "#/components/schemas/GeoAeoCompetitor"
        proofPoints:
          type: array
          items:
            type: string
        reviewsUrl:
          type: string
          format: uri
        googleBusinessUrl:
          type: string
          format: uri
        importantPages:
          type: array
          items:
            type: string
            format: uri
        customerQuestions:
          type: array
          items:
            type: string
        knownFor:
          type: string
        packageTier:
          $ref: "#/components/schemas/GeoAeoPackageTier"
      required:
        - businessName
        - websiteUrl

    GeoAeoProfile:
      allOf:
        - $ref: "#/components/schemas/GeoAeoProfileInput"
        - type: object
          properties:
            id:
              type: string
            auditId:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required:
            - id
            - auditId
            - businessName
            - websiteUrl
            - packageTier
            - createdAt
            - updatedAt

    GeoAeoPrompt:
      type: object
      properties:
        id:
          type: string
        auditId:
          type: string
        promptText:
          type: string
        intent:
          $ref: "#/components/schemas/GeoAeoPromptIntent"
        targetService:
          type: string
          nullable: true
        targetLocation:
          type: string
          nullable: true
        buyerStage:
          type: string
        priority:
          type: integer
        approved:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - auditId
        - promptText
        - intent
        - buyerStage
        - priority
        - approved
        - createdAt
        - updatedAt

    GenerateGeoAeoPromptsBody:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/GeoAeoProfileInput"
        maxPrompts:
          type: integer
          minimum: 1
          maximum: 100

    GeoAeoPromptList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GeoAeoPrompt"
        total:
          type: integer
      required:
        - items
        - total

    GeoAeoObservationInput:
      type: object
      properties:
        promptId:
          type: string
        surface:
          $ref: "#/components/schemas/GeoAeoSurface"
        observedAt:
          type: string
          format: date-time
        brandMentioned:
          type: boolean
        brandCited:
          type: boolean
        brandPosition:
          type: integer
        sentiment:
          type: string
          enum: [positive, neutral, negative, mixed, unknown]
        answerSummary:
          type: string
        citedUrls:
          type: array
          items:
            type: string
            format: uri
        competitorsMentioned:
          type: array
          items:
            type: string
        rawAnswerExcerpt:
          type: string
        confidenceScore:
          type: integer
          minimum: 0
          maximum: 100
        notes:
          type: string
      required:
        - surface

    GeoAeoObservation:
      allOf:
        - $ref: "#/components/schemas/GeoAeoObservationInput"
